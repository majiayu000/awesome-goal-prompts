<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>页面未找到 · The Contract Codex</title>
    <link rel="icon" href="assets/goal-map.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/goal-map.svg">
    <style>
      :root {
        --bg: #16140f;
        --ink: #f4f1e9;
        --muted: #9a9385;
        --accent: #c4a77d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        line-height: 1.5;
      }
      .container {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 24px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 48px;
        text-decoration: none;
        color: var(--ink);
      }
      .brand-mark {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -1px;
        background: var(--accent);
        color: var(--bg);
        padding: 4px 10px;
        border-radius: 4px;
      }
      .brand-name {
        font-size: 18px;
        font-weight: 600;
      }
      h1 {
        font-size: 72px;
        font-weight: 700;
        margin: 0 0 16px;
        letter-spacing: -2px;
      }
      .subtitle {
        font-size: 20px;
        color: var(--muted);
        margin-bottom: 32px;
      }
      .message {
        font-size: 15px;
        color: var(--ink);
        margin-bottom: 40px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .links a {
        display: inline-flex;
        align-items: center;
        padding: 10px 18px;
        border: 1px solid #3a3630;
        border-radius: 6px;
        color: var(--ink);
        text-decoration: none;
        font-size: 14px;
        transition: all 0.1s ease;
      }
      .links a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .links a.primary {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
      }
      .links a.primary:hover {
        background: #d4b88f;
      }
      .hint {
        margin-top: 48px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="/awesome-goal-prompts/" class="brand" aria-label="The Contract Codex home">
        <span class="brand-mark">/g</span>
        <span class="brand-name">The Contract Codex</span>
      </a>

      <h1>404</h1>
      <div class="subtitle">页面不存在</div>

      <div class="message">
        你访问的路径可能已移动、删除，或输入有误。<br>
        这个站点目前主要提供可搜索的 /goal 任务合同目录。
      </div>

      <div class="links">
        <a href="/awesome-goal-prompts/" class="primary">返回首页 · 浏览 Catalog</a>
        <a href="/awesome-goal-prompts/docs.html">阅读文档：如何写好 /goal</a>
        <a href="https://github.com/majiayu000/awesome-goal-prompts">GitHub 仓库</a>
      </div>

      <div class="hint">
        提示：你也可以直接在首页使用搜索框查找 “auth”、“migration”、“tests” 等关键词。
      </div>
    </div>
  </body>
</html>
