<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Goal prompt catalog interface</title>
  <desc id="desc">A colorful creative workspace illustration showing a searchable goal prompt library.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8EA59B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#E6F2EB"/>
  <rect width="960" height="540" fill="url(#grid)" opacity=".5"/>
  <rect x="104" y="76" width="752" height="388" rx="12" fill="#FFFEFA" stroke="#18181E" stroke-width="3"/>
  <rect x="104" y="76" width="752" height="62" rx="12" fill="#CFE2D8" stroke="#18181E" stroke-width="3"/>
  <path d="M104 138H856" stroke="#18181E" stroke-width="3"/>

  <g font-family="Avenir Next, Segoe UI, sans-serif" letter-spacing="0">
    <text x="136" y="115" fill="#18181E" font-size="22" font-weight="560">Goal library</text>
    <text x="646" y="115" fill="#394A47" font-size="18">creative contracts</text>
  </g>

  <rect x="136" y="172" width="202" height="44" rx="8" fill="#FFFEFA" stroke="#8EA59B" stroke-width="2"/>
  <text x="158" y="200" fill="#394A47" font-family="Avenir Next, Segoe UI, sans-serif" font-size="18">search by task</text>

  <rect x="136" y="238" width="202" height="154" rx="8" fill="#F4FFF6" stroke="#8EA59B" stroke-width="2"/>
  <line x1="160" y1="274" x2="312" y2="274" stroke="#247A5C" stroke-width="3"/>
  <line x1="160" y1="314" x2="286" y2="314" stroke="#A65245" stroke-width="3"/>
  <line x1="160" y1="354" x2="306" y2="354" stroke="#2F60D6" stroke-width="3"/>

  <rect x="388" y="170" width="352" height="82" rx="8" fill="#FFFEFA" stroke="#2F60D6" stroke-width="4"/>
  <rect x="388" y="278" width="352" height="82" rx="8" fill="#FFFEFA" stroke="#8EA59B" stroke-width="2"/>
  <rect x="388" y="386" width="352" height="44" rx="8" fill="#18181E"/>

  <g font-family="Avenir Next, Segoe UI, sans-serif" letter-spacing="0">
    <text x="416" y="205" fill="#18181E" font-size="22" font-weight="560">Auth tests and lint clean</text>
    <text x="416" y="232" fill="#394A47" font-size="17">done when tests and lint both pass</text>
    <text x="416" y="314" fill="#18181E" font-size="22" font-weight="560">Visual migration gate</text>
    <text x="416" y="342" fill="#394A47" font-size="17">compare snapshots before changing scope</text>
    <text x="416" y="415" fill="#F4FFE7" font-size="18">copy prompt</text>
  </g>

  <path d="M762 194H814M762 220H832" stroke="#A65245" stroke-width="4" stroke-linecap="round"/>
  <path d="M762 302H814M762 330H832" stroke="#A8C94A" stroke-width="4" stroke-linecap="round"/>
  <rect x="726" y="96" width="82" height="18" rx="9" fill="#F0C95C" stroke="#18181E" stroke-width="2"/>
</svg>
