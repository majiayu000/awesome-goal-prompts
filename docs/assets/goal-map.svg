<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Goal prompt catalog map</title>
  <desc id="desc">A technical diagram of connected goal prompt contracts.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D8DEE4" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#111418" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#F4F7F6"/>
  <rect width="960" height="540" fill="url(#grid)" opacity=".8"/>
  <path d="M104 388 C242 276 342 424 480 284 C614 148 728 252 862 112" fill="none" stroke="#121417" stroke-width="8" stroke-linecap="round"/>
  <path d="M104 388 C242 276 342 424 480 284 C614 148 728 252 862 112" fill="none" stroke="#38B26C" stroke-width="3" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="86" y="326" width="184" height="100" rx="8" fill="#121417"/>
    <rect x="318" y="348" width="184" height="100" rx="8" fill="#FFFFFF"/>
    <rect x="462" y="210" width="184" height="100" rx="8" fill="#FFFFFF"/>
    <rect x="676" y="138" width="184" height="100" rx="8" fill="#121417"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="0">
    <text x="112" y="364" fill="#8EF2A4">GOAL</text>
    <text x="112" y="394" fill="#FFFFFF">one objective</text>
    <text x="344" y="386" fill="#E24B3C">CONTEXT</text>
    <text x="344" y="416" fill="#121417">read first</text>
    <text x="488" y="248" fill="#1F68E5">VERIFY</text>
    <text x="488" y="278" fill="#121417">fresh proof</text>
    <text x="702" y="176" fill="#FFC857">STOP</text>
    <text x="702" y="206" fill="#FFFFFF">pause on risk</text>
  </g>
  <g fill="#38B26C" stroke="#121417" stroke-width="4">
    <circle cx="104" cy="388" r="14"/>
    <circle cx="480" cy="284" r="14"/>
    <circle cx="862" cy="112" r="14"/>
  </g>
</svg>
