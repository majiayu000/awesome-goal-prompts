<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Goal prompt catalog interface</title>
  <desc id="desc">A calm interface illustration showing a searchable goal prompt library.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C9D1D5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#EDF1EF"/>
  <rect width="960" height="540" fill="url(#grid)" opacity=".72"/>
  <rect x="112" y="84" width="736" height="372" rx="10" fill="#FFFFFF" stroke="#17191C" stroke-width="3"/>
  <rect x="112" y="84" width="736" height="58" rx="10" fill="#DFE6E3" stroke="#17191C" stroke-width="3"/>
  <path d="M112 142H848" stroke="#17191C" stroke-width="3"/>

  <g font-family="Avenir Next, Segoe UI, sans-serif" letter-spacing="0">
    <text x="142" y="121" fill="#17191C" font-size="22" font-weight="560">Goal library</text>
    <text x="650" y="121" fill="#3F4850" font-size="18">verified contracts</text>
  </g>

  <rect x="142" y="174" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#9AA8AF" stroke-width="2"/>
  <text x="164" y="201" fill="#3F4850" font-family="Avenir Next, Segoe UI, sans-serif" font-size="18">search by task</text>

  <rect x="142" y="236" width="198" height="152" rx="8" fill="#F4F6F5" stroke="#9AA8AF" stroke-width="2"/>
  <line x1="166" y1="272" x2="314" y2="272" stroke="#9AA8AF" stroke-width="3"/>
  <line x1="166" y1="312" x2="286" y2="312" stroke="#9AA8AF" stroke-width="3"/>
  <line x1="166" y1="352" x2="304" y2="352" stroke="#9AA8AF" stroke-width="3"/>

  <rect x="388" y="174" width="338" height="78" rx="8" fill="#FFFFFF" stroke="#275FBA" stroke-width="3"/>
  <rect x="388" y="276" width="338" height="78" rx="8" fill="#FFFFFF" stroke="#9AA8AF" stroke-width="2"/>
  <rect x="388" y="378" width="338" height="42" rx="8" fill="#17191C"/>

  <g font-family="Avenir Next, Segoe UI, sans-serif" letter-spacing="0">
    <text x="414" y="207" fill="#17191C" font-size="22" font-weight="560">Auth tests and lint clean</text>
    <text x="414" y="233" fill="#3F4850" font-size="17">done when tests and lint both pass</text>
    <text x="414" y="310" fill="#17191C" font-size="22" font-weight="560">Visual migration gate</text>
    <text x="414" y="336" fill="#3F4850" font-size="17">compare snapshots before changing scope</text>
    <text x="414" y="406" fill="#FFFFFF" font-size="18">copy prompt</text>
  </g>

  <path d="M744 194H792M744 218H812M744 296H792M744 320H812" stroke="#9F4B43" stroke-width="4" stroke-linecap="round"/>
</svg>
