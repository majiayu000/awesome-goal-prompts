<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · The Contract Codex</title>
  <meta name="description" content="$intent">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://majiayu000.github.io/awesome-goal-prompts/goals/$slug.html">
  <link rel="icon" href="../assets/goal-map.svg" type="image/svg+xml">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="The Contract Codex">
  <meta property="og:title" content="$title · The Contract Codex">
  <meta property="og:description" content="$intent">
  <meta property="og:url" content="https://majiayu000.github.io/awesome-goal-prompts/goals/$slug.html">
  <meta property="og:image" content="https://majiayu000.github.io/awesome-goal-prompts/assets/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$intent">

  <style>
    :root {
      --bg: #16140f;
      --ink: #f4f1e9;
      --muted: #9a9385;
      --accent: #c4a77d;
      --card: #1f1c17;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      line-height: 1.6;
      padding: 40px 20px;
      max-width: 860px;
      margin-left: auto;
      margin-right: auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #3a3630;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
    }
    .brand-mark {
      background: var(--accent);
      color: var(--bg);
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 18px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .badge {
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      border: 1px solid #3a3630;
    }
    .section {
      margin-bottom: 36px;
    }
    .section h2 {
      font-size: 15px;
      color: var(--accent);
      margin: 0 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .prompt-box {
      background: var(--card);
      border: 1px solid #3a3630;
      border-radius: 8px;
      padding: 24px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.65;
    }
    .source {
      font-size: 13px;
      color: var(--muted);
    }
    .source a {
      color: var(--accent);
    }
    .footer {
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid #3a3630;
      font-size: 13px;
      color: var(--muted);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .copy-btn {
      float: right;
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="../" class="brand">
      <span class="brand-mark">/g</span>
      <span>The Contract Codex</span>
    </a>
    <a href="../" style="color: var(--muted); font-size: 13px;">← 返回动态 Catalog</a>
  </div>

  <h1>$title</h1>
  <p style="font-size: 17px; color: var(--muted); margin-top: 4px;">$intent</p>

  <div class="meta">
    <span class="badge">难度：$difficulty</span>
    <span class="badge">分类：$category</span>
    $source_badge
  </div>

  <div class="section">
    <h2>完整 Prompt（可直接复制）</h2>
    <div style="position: relative;">
      <button class="copy-btn" onclick="copyPrompt()">复制 Prompt</button>
      <pre class="prompt-box" id="prompt-box">$prompt</pre>
    </div>
  </div>

$source_section

  <div class="footer">
    <p>
      这是一个为 coding agent（Claude Code、Codex、Cursor 等）设计的可执行任务合同。<br>
      想搜索更多、按难度/来源筛选？请使用 <a href="../">动态 Catalog</a>。
    </p>
    <p style="margin-top: 12px;">
      来源：<a href="https://github.com/majiayu000/awesome-goal-prompts">GitHub - awesome-goal-prompts</a>
    </p>
  </div>

  <script>
    function copyPrompt() {
      const text = document.getElementById('prompt-box').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btns = document.querySelectorAll('.copy-btn');
        btns.forEach(b => {
          const old = b.textContent;
          b.textContent = '已复制 ✓';
          setTimeout(() => b.textContent = old, 1600);
        });
      });
    }
  </script>
</body>
</html>
