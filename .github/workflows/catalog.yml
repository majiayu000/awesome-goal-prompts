name: Catalog quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate source data
        run: python3 scripts/validate_data.py

      - name: Regenerate catalog
        run: python3 scripts/generate_examples.py

      - name: Validate static contract rendering
        run: python3 scripts/validate_static_contracts.py

      - name: Regenerate static contract pages
        run: python3 scripts/generate_static_contracts.py --output docs/goals

      - name: Regenerate sitemap
        run: python3 scripts/generate_sitemap.py

      - name: Validate generated metadata
        run: python3 scripts/validate_metadata.py

      - name: Regenerate health report
        run: python3 scripts/generate_catalog_health.py

      - name: Evaluate search quality
        run: python3 scripts/evaluate_search.py

      - name: Evaluate make-goal skill fixtures
        run: python3 skills/make-goal/scripts/run_evals.py

      - name: Check page JavaScript
        run: node --check docs/app.js

      - name: Check generated files are committed
        run: |
          if [ -n "$(git status --short)" ]; then
            git status --short
            git diff --exit-code || true
            echo ""
            echo "::error::Generated files are out of date. Edit data/source/*.toml, then run:"
            echo "::error::  python3 scripts/generate_examples.py"
            echo "::error::  python3 scripts/generate_static_contracts.py --output docs/goals"
            echo "::error::  python3 scripts/generate_sitemap.py"
            echo "::error::  python3 scripts/generate_catalog_health.py"
            echo "::error::Commit the regenerated outputs alongside your data change. Do not hand-edit README catalog, data/examples.json, docs/examples.json, docs/goals/*.html, prompts/*.md, or docs/catalog-health.md."
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check
